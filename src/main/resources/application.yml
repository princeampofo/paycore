spring:
  application:
    name: paycore
  datasource:
    url: jdbc:postgresql://localhost:5433/paycore
    username: paycore
    password: paycore
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # A missing or null "amount" must be an error, not silently 0. Optional fields (note,
      # customer) are objects, so leaving them out just makes them null.
      fail-on-null-for-primitives: true

paycore:
  processor:
    base-url: http://localhost:8081
    # How long we wait for a charge before calling the payment "unknown".
    timeout: 2s
  status-check:
    # How often to ask the processor about payments whose outcome we don't know.
    interval-ms: 5000
    # Wait this long before asking, so a charge still on its way to the processor
    # isn't reported as "never received".
    min-age: 30s
  webhooks:
    # How often the dispatcher looks for events to send.
    interval-ms: 1000
    timeout: 5s
    # Retries wait base-delay × 2^(attempt − 1): 2 s, 4 s, 8 s ... After max-attempts the event is "dead".
    max-attempts: 8
    base-delay: 2s
    # A claimed event isn't picked up again for this long, so it's only resent if we crash mid-send.
    lease: 60s
  metrics:
    # How often the database-backed gauges (unknown payments, outbox lag, ledger health) are recomputed.
    refresh-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      # Lets Prometheus compute latency percentiles (p50, p99) from a histogram.
      percentiles-histogram:
        http.server.requests: true
