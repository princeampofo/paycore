spring:
  application:
    name: paycore
  datasource:
    url: jdbc:postgresql://localhost:5433/paycore
    username: paycore
    password: paycore
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # A missing "amount" must be an error, not silently 0.
      fail-on-missing-creator-properties: true
      fail-on-null-for-primitives: true

paycore:
  processor:
    base-url: http://localhost:8081
    # How long we wait for a charge before calling the payment "unknown".
    timeout: 2s
